name: Build Desktop Installers

# Builds Vifug Lyrics native installers for Windows, macOS and Linux.
# - Manual runs (workflow_dispatch) upload installers as artifacts.
# - Tag pushes (v*) also attach installers to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Needed so the release job can create/update the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
          - os: macos-latest
            target: --mac dmg
          - os: ubuntu-latest
            target: --linux AppImage
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Compile the native NDI addon (@stagetimerio/grandiose). Bun skips the
      # package's own install script, so build it here: download the NDI SDK,
      # compile with node-gyp (N-API — no Electron rebuild needed), assemble
      # dist/. Best-effort: if a runner can't build it, the installer still
      # ships and NDI degrades to the OBS bridge at runtime.
      - name: Build native NDI addon
        continue-on-error: true
        working-directory: packages/desktop/node_modules/@stagetimerio/grandiose
        run: |
          node scripts/ndi.js
          npx --yes node-gyp rebuild
          node scripts/dist.js

      - name: Build web bundle
        run: bun run build
        working-directory: packages/web

      # Produce the pre-seeded library database bundled into the installer
      # (electron-builder extraResources expects packages/web/local.db).
      - name: Generate seed database
        working-directory: packages/web
        env:
          DATABASE_URL: file:local.db
        run: |
          bunx drizzle-kit push --force
          bun src/api/seed.ts

      - name: Build desktop bundle
        run: bun run build
        working-directory: packages/desktop

      - name: Package installer
        run: bunx electron-builder ${{ matrix.target }} --publish never
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds: do NOT pass empty CSC_LINK/WIN_CSC_LINK env vars —
          # electron-builder treats an empty string as a certificate path and fails.
          # When you have signing certs, add the secrets back here:
          #   CSC_LINK / CSC_KEY_PASSWORD (macOS), WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (Windows),
          #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (notarization)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vifug-lyrics-${{ matrix.os }}
          path: |
            packages/desktop/release/*/*-Setup.exe
            packages/desktop/release/*/*.dmg
            packages/desktop/release/*/*.AppImage
          if-no-files-found: ignore

  # Publishing is its own job, deliberately.
  #
  # Each build used to attach its own installer, so three machines raced to
  # create and then update the same release. Any one of them hitting a bad
  # moment on the API - which is exactly what happened on v1.13.3, where macOS
  # failed between a successful Linux and a successful Windows - loses that
  # platform's installer and marks the whole run failed, with the only remedy
  # being a full rebuild of a job that had already produced a good file.
  #
  # Collecting the artifacts and publishing once removes the race, turns three
  # chances of failure into one, and makes recovery cheap: re-running this job
  # alone re-attaches everything in seconds without rebuilding anything.
  publish:
    name: Publish release
    needs: build
    # `always()` so a single platform failing to BUILD still ships the others,
    # rather than withholding a working Windows installer over a broken macOS
    # one. Guarded on there being artifacts to publish at all.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect installers from every platform
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: vifug-lyrics-*
          merge-multiple: true

      - name: Show what will be attached
        run: |
          echo "Installers found:"
          find installers -type f \( -name '*-Setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -printf '  %f  %s bytes\n' || true

      # Published to this repository, which works only while it is public: a
      # private repo's release assets need authentication to download, so the
      # site's download buttons and the app's update check would both 404. If
      # it is ever made private again, publish to a separate public releases
      # repository instead (add `repository:` and a scoped `token:` here).
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            installers/**/*-Setup.exe
            installers/**/*.dmg
            installers/**/*.AppImage
